services:
  db:
    image: postgres:16-alpine
    container_name: asteria-db
    environment:
      POSTGRES_USER: asteria
      POSTGRES_PASSWORD: asteria
      POSTGRES_DB: asteria
    ports:
      - "5433:5432"
    volumes:
      - asteria-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asteria"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  asteria-pgdata:
